<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .gradient-text {
            background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 3rem;
            padding: 4rem;
            width: 800px;
            height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(167, 139, 250, 0.1);
        }
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(167, 139, 250, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: -50px;
            right: -50px;
        }
        .glow-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(236, 72, 153, 0.1);
            filter: blur(80px);
            border-radius: 50%;
            bottom: -30px;
            left: -30px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="glow"></div>
        <div class="glow-2"></div>
        
        <div class="relative z-10">
            <div class="text-zinc-500 font-black tracking-[0.4em] uppercase text-[12px] mb-6">Standard Product Bundle</div>
            <h1 class="text-white text-7xl font-black italic tracking-tighter uppercase mb-4 leading-none">
                FACELESS<span class="gradient-text">OS</span>
            </h1>
            <p class="text-zinc-400 text-xl font-light mb-12 max-w-lg leading-relaxed">
                Unlock the complete viral engine. Scripts, Visuals, and the 30-day Roadmap.
            </p>
            
            <div class="grid grid-cols-2 gap-y-4 gap-x-8">
                <div class="flex items-center space-x-3">
                    <span class="text-pink-500">✓</span>
                    <span class="text-zinc-300 font-bold uppercase text-[10px] tracking-widest">30 Viral Scripts</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-pink-500">✓</span>
                    <span class="text-zinc-300 font-bold uppercase text-[10px] tracking-widest">Visual DNA Library</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-pink-500">✓</span>
                    <span class="text-zinc-300 font-bold uppercase text-[10px] tracking-widest">Growth Blueprint</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-pink-500">✓</span>
                    <span class="text-zinc-300 font-bold uppercase text-[10px] tracking-widest">0-1k Roadmap</span>
                </div>
            </div>
            
            <div class="absolute bottom-0 right-0">
                <div class="text-white text-7xl font-black tracking-tighter">$27</div>
            </div>
        </div>
    </div>
</body>
</html>
